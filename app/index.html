<style id="tema3">
.pills{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 12px}
.pill{flex:none;border:1.5px solid #D6DCE8;background:#fff;color:var(--navy);font:inherit;font-weight:700;font-size:13.5px;border-radius:999px;padding:8px 16px}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.pc{position:relative;padding-left:22px;overflow:hidden}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,#D6DCE8)}
.step{display:flex;margin:4px 0 2px}
.step>div{flex:1;text-align:center;position:relative;font-size:11px;font-weight:700;color:#8A94A6;line-height:1.2}
.step>div::before{content:"";display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#E3E8F0;margin:0 auto 6px;position:relative;z-index:1;color:#fff;font-size:13px}
.step>div::after{content:"";position:absolute;top:11px;left:calc(50% + 14px);right:calc(-50% + 14px);height:3px;background:#E3E8F0}
.step>div:last-child::after{display:none}
.step>div.ok{color:var(--navy)}
.step>div.ok::before{content:"\2713";background:var(--blue)}
.step>div.ok::after{background:var(--blue)}
.step>div.on{color:var(--navy)}
.step>div.on::before{background:var(--amber);box-shadow:0 0 0 4px rgba(245,166,35,.25)}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.mchip{background:#E8F0FF;color:var(--blue);font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px}
.rate{margin-top:2px;font-size:14px}
.est{color:var(--amber)}
.nt.novo{border-left:4px solid var(--amber)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--amber);flex:none}
textarea{min-height:110px}
/* grelha-fix */
html,body{max-width:100%;overflow-x:hidden}
.grade2{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}
.tile2{min-width:0!important;padding-left:6px!important;padding-right:6px!important;overflow-wrap:anywhere;word-break:break-word;hyphens:auto}
.tile2>*:not(.tile2-i){font-size:13px!important;line-height:1.25!important}
.selo{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;vertical-align:middle}
.selo.verified{background:#E3F2FD;color:#0B5CAD}
.selo.featured{background:#FFF1DB;color:#9A5B00}
.card.destaque{border:2px solid #FF9800}
</style>

function ini(n){var p=String(n||"?").trim().split(/\s+/);return(p[0][0]+(p[1]?p[1][0]:"")).toUpperCase()}
function kz(n){return String(n||0).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" Kz"}
function val(id){return document.getElementById(id).value.trim()}
function msg(e){var m=(e&&e.message)||"Erro";if(m==="Failed to fetch"||/NetworkError|Load failed/i.test(m))m="Sem ligação ao servidor. Verifique a internet e tente de novo (o servidor pode demorar até 1 minuto a acordar).";return m}
function carregando(){return '<p class="vazio">A carregar...</p>'}
function erro(e){return '<p class="vazio">'+esc(msg(e))+'</p><button class="btn" onclick="render()">Tentar de novo</button>'}
function topo(t){return '<div class="topo"><button class="voltar" onclick="voltar()">&#8249;</button><h2>'+t+'</h2></div>'}

function api(m,p,b){
  var h={"Content-Type":"application/json"};
  if(TOKEN)h.Authorization="Bearer "+TOKEN;
  return fetch(BASE()+p,{method:m,headers:h,body:b?JSON.stringify(b):undefined}).then(function(r){
    return r.json().catch(function(){return{}}).then(function(d){
      if(r.status===401&&TOKEN){sair();throw new Error("Sessão expirada. Entre de novo.")}
      if(!r.ok)throw new Error(d.error||("Erro "+r.status));
      return d;
    });
  });
}

var TICK=0;
function paint(t,h){if(t===TICK)document.getElementById("app").innerHTML=h}
function render(){
  TICK++;
  if(CHT){clearInterval(CHT);CHT=null}
  var f=V[S.v]||vHome,h=f(TICK);
  if(h!==undefined)paint(TICK,h);
  renderNav();
}
function go(v,a,b){
  if(!TOKEN&&v!=="reset")v="auth";
  if(v==="chat"){S.back=S.v;S.backId=S.id}
  S.v=v;
  if(v==="lista"){S.cat=a||null;S.q=""}
  if(v==="pedido"){S.cat=a||null}
  if(v==="det"||v==="aberto"||v==="chat"){S.id=a}
  if(v==="chat"){S.pid=b}
  render();window.scrollTo(0,0);
}
function voltar(){
  if(introAberta()){introFim();return true}
  if(!TOKEN||S.v==="home"||S.v==="auth")return false;
  if(S.v==="chat"){go(S.back||"pedidos",S.backId);return true}
  go(PAI[S.v]||"home");return true;
}
function renderNav(){
  var n=document.getElementById("nav");
  sinoEstado();
  if(TOKEN&&S.v!=="chat"&&S.v!=="auth"&&S.v!=="notif")atualizarSino();
  if(!TOKEN||S.v==="chat"){n.innerHTML="";return}
  var it=[["home","Início","M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"],
          ["pedidos","Pedidos","M6 3h9l4 4v14H6z M14 3v5h5 M9 13h7 M9 17h7"],
          ["prof","Profissional","M3 7h18v13H3z M8 7V4h8v3"],
          ["conta","Conta","M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21a8 8 0 0 1 16 0"]];
  var m={lista:"home",pedido:"home",det:"pedidos",abertos:"prof",aberto:"prof",minhas:"prof"};
  var on=m[S.v]||S.v;
  n.innerHTML=it.map(function(x){
    return '<button class="'+(on===x[0]?"on":"")+'" onclick="go(\''+x[0]+'\')">'+svg(x[2],24,"currentColor",2)+x[1]+'</button>';
  }).join("");
}

function sair(){
  TOKEN=null;USER=null;lsDel("kamba_token");lsDel("kamba_user");avisosDesligar();
  S.v="auth";S.mode="login";render();
}
function vAuth(){
  var r=S.mode==="registo";
  return '<div class="logo">'+LOGO+'</div><h1>Kamba</h1><p class="sub">'+(r?'Crie a sua conta':'Entre na sua conta')+'</p>'+
  (r?'<label>Nome</label><input class="f" id="a_n" autocomplete="name">':'')+

function hora(c){try{return new Date(c+"Z").toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function bolhas(l){
  if(!l.length)return '<p class="vazio" style="margin-top:20px">Ainda não há mensagens. Diga olá.</p>';
  return l.map(function(m){return '<div class="msg '+(m.mine?'eu':'ele')+'">'+esc(m.body)+'<div class="hora">'+hora(m.created_at)+'</div></div>'}).join("");
}
function pintarMsgs(d,forcar){
  var el=document.getElementById("msgs");if(!el)return;
  var ult=d.messages.length?d.messages[d.messages.length-1].id:0;
  var chave=d.messages.length+":"+ult;
  if(el.getAttribute("data-k")===chave&&!forcar)return;
  var perto=(window.innerHeight+window.scrollY)>=document.body.scrollHeight-120;
  el.innerHTML=bolhas(d.messages);el.setAttribute("data-k",chave);
  if(perto||forcar)window.scrollTo(0,document.body.scrollHeight);
}
function vChat(t){
  var url="/requests/"+S.id+"/chat"+(S.pid?"?pro_id="+S.pid:"");
  api("GET",url).then(function(d){
    if(t!==TICK)return;
    paint(t,topo(esc(d.with.name))+'<div id="msgs"></div>'+
    '<div class="barra"><input class="f" id="c_t" placeholder="Escreva uma mensagem" maxlength="1000" onkeydown="if(event.key===\'Enter\')enviarMsg()"><button class="btn sm" onclick="enviarMsg()">Enviar</button></div>');
    pintarMsgs(d,true);
    CHT=setInterval(function(){
      if(S.v!=="chat"){clearInterval(CHT);CHT=null;return}
      api("GET",url).then(function(x){pintarMsgs(x,false)}).catch(function(){});
    },4000);
  }).catch(function(e){paint(t,topo("Conversa")+erro(e))});
  return carregando();
}
function enviarMsg(){
  var i=document.getElementById("c_t"),b=i.value.trim();if(!b)return;
  i.value="";
  api("POST","/requests/"+S.id+"/chat",{body:b,pro_id:S.pid}).then(function(d){pintarMsgs(d,true)}).catch(function(e){i.value=b;alert(msg(e))});
}

function fotoUrl(id){
  if(FOTOS[id])return Promise.resolve(FOTOS[id]);
  return fetch(BASE()+"/photos/"+id,{headers:{Authorization:"Bearer "+TOKEN}}).then(function(r){
    if(!r.ok)throw new Error("foto");return r.blob();
  }).then(function(b){FOTOS[id]=URL.createObjectURL(b);return FOTOS[id]});
}
function hidratarFotos(){
  var l=document.querySelectorAll("[data-foto]");
  for(var i=0;i<l.length;i++){(function(el){
    fotoUrl(el.getAttribute("data-foto")).then(function(u){
      el.style.backgroundImage="url('"+u+"')";el.style.backgroundSize="cover";el.style.backgroundPosition="center";
      if(el.classList.contains("av")){for(var n=el.childNodes.length-1;n>=0;n--){if(el.childNodes[n].nodeType===3)el.removeChild(el.childNodes[n])}}
    }).catch(function(){});
  })(l[i])}
}
function abrirFoto(id){

function escolher(multi,cb){
  var i=document.createElement("input");i.type="file";i.accept="image/*";if(multi)i.multiple=true;
  i.style.display="none";document.body.appendChild(i);
  i.onchange=function(){var f=i.files;document.body.removeChild(i);if(f&&f.length)cb(f)};
  i.click();
}
function comprimirTudo(file,max,lim){
  return new Promise(function(ok,ko){
    var fr=new FileReader();
    fr.onerror=function(){ko(new Error("Não foi possível ler a foto."))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){ko(new Error("Esse ficheiro não é uma imagem válida."))};
      im.onload=function(){
        try{
          var big=Math.max(im.width,im.height),res=null,fe=1,qs=[0.82,0.7,0.58,0.46];
          while(!res&&fe>0.3){
            var s=Math.min(1,max/big)*fe,w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s));
            var c=document.createElement("canvas");c.width=w;c.height=h;
            var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
            for(var k=0;k<qs.length&&!res;k++){var d=c.toDataURL("image/jpeg",qs[k]);if(d.length*0.75<=lim)res=d}
            fe=fe*0.8;
          }
          if(!res)throw new Error("Foto demasiado grande.");
          var tc=document.createElement("canvas"),ts=Math.min(1,160/big);
          tc.width=Math.max(1,Math.round(im.width*ts));tc.height=Math.max(1,Math.round(im.height*ts));
          var tx=tc.getContext("2d");tx.fillStyle="#fff";tx.fillRect(0,0,tc.width,tc.height);tx.drawImage(im,0,0,tc.width,tc.height);
          ok({b64:res.split(",")[1],thumb:tc.toDataURL("image/jpeg",0.6)});
        }catch(e){ko(e)}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function addFotosPedido(){
  escolher(true,function(files){
    var arr=[].slice.call(files).slice(0,6-NP.fotos.length),p=Promise.resolve();
    arr.forEach(function(f){p=p.then(function(){return comprimirTudo(f,1280,420*1024).then(function(r){NP.fotos.push(r)})})});

function enviarPedido(){
  var v=NP.v,cat=NP.cat,qs=QS[cat]||[],falta=[],i;
  var o=parseInt(v._o,10);
  if(!(v._t||"").trim()){alert("Diga o que precisa.");return}
  if(!(v._l||"").trim()){alert("Indique o local.");return}
  if(isNaN(o)||o<0){alert("Indique o orçamento em Kz.");return}
  for(i=0;i<qs.length;i++){if(qs[i][4]&&!String(v[qs[i][0]]||"").trim())falta.push(qs[i][1])}
  if(falta.length){alert("Preencha: "+falta.join(", ")+".");return}
  var min=FOTO_MIN[cat]||0;
  if(NP.fotos.length<min){alert("Adicione pelo menos "+min+" foto(s) do local. Sem elas o profissional não consegue orçamentar.");return}
  var bt=document.getElementById("env"),rid=null;
  bt.disabled=true;bt.textContent="A enviar...";
  api("POST","/requests",{title:v._t.trim(),category:cat,location:v._l.trim(),budget_kz:o,description:(v._d||"").trim()}).then(function(r){
    rid=r.id;var p=Promise.resolve();
    NP.fotos.forEach(function(f){p=p.then(function(){return api("POST","/photos",{kind:"request",request_id:rid,data:f.b64})})});
    return p;
  }).then(function(){
    var fl={};qs.forEach(function(q){var x=String(v[q[0]]||"").trim();if(x)fl[q[0]]=x});
    return api("POST","/requests/"+rid+"/details",{fields:fl});
  }).then(function(){NP={cat:null,v:{},fotos:[]};go("pedidos")}).catch(function(e){
    if(rid)api("POST","/requests/"+rid+"/cancel").catch(function(){});
    bt.disabled=false;bt.textContent="Enviar pedido";alert(msg(e));
  });
}
function cancelarPedido(id){
  if(!confirm("Cancelar este pedido?"))return;
  api("POST","/requests/"+id+"/cancel").then(function(){go("pedidos")}).catch(function(e){alert(msg(e))});
}

var IN_I=0,IN_V=true,IN_T=0,IN_TM=null;
function introAberta(){var e=document.getElementById("intro");return !!e&&e.style.display==="flex"}

function introIr(v){
  if(v&&window.KambaVoz&&!KambaVoz.pronta()){
    alert("Este telemóvel não tem voz em português instalada. Vá a Definições > Idioma > Texto para voz e instale o pacote em português (Google). A apresentação segue sem voz.");
    v=false;
  }
  IN_V=v;IN_I=0;introSlide();
}
function introFim(){
  introParar();
  document.getElementById("intro").style.display="none";
  lsSet("kamba_intro","1");
}
var IN_FIM=null;
function introFalaFim(){var f=IN_FIM;IN_FIM=null;if(f)f()}
function falar(t,fim){
  IN_FIM=fim;
  try{
    if(window.KambaVoz){KambaVoz.falar(t);return}
    var ss=window.speechSynthesis;if(!ss){IN_FIM=null;return}
    var u=new SpeechSynthesisUtterance(t);
    var vs=ss.getVoices()||[],v=null,i;
    for(i=0;i<vs.length;i++){if(/^pt/i.test(vs[i].lang)){v=vs[i];break}}
    if(v){u.voice=v;u.lang=v.lang}else{u.lang="pt-PT"}
    u.rate=0.95;u.onend=fim;
    ss.speak(u);
  }catch(e){IN_FIM=null}
}
function introSlide(){
  var d=INTRO[IN_I];if(!d){introFim();return}
  introParar();
  var my=IN_T,e=document.getElementById("intro");
  var dots=INTRO.map(function(x,i){return '<i class="'+(i===IN_I?"on":"")+'"></i>'}).join("");
  var h='<button class="isk" onclick="introFim()">Saltar</button><p class="ik">'+d.k+'</p><h1 class="ih">'+esc(d.h)+'</h1>';
  if(d.steps){
    h+='<div class="ist">'+d.steps.map(function(s,i){return '<b style="animation-delay:'+(0.9+i*0.9).toFixed(1)+'s">'+(i+1)+' &middot; '+s+'</b>'}).join("")+'</div>';
  }else if(d.p){
    h+='<p class="ip">'+d.p.split(" ").map(function(w,i){return '<span style="animation-delay:'+(0.9+i*0.28).toFixed(2)+'s">'+esc(w)+'&nbsp;</span>'}).join("")+'</p>';
  }
  if(d.fim)h+='<div class="ibt"><button class="btn" style="background:#FF9800;border-color:#FF9800;color:#0A2A66" onclick="introFim()">Começar</button></div>';
  h+='<div class="idots">'+dots+'</div>';
  e.innerHTML=h;
  if(d.fim&&!IN_V)return;
  var voz=d.v||(d.h+" "+d.p);
  var avancar=function(){if(my!==IN_T||d.fim)return;clearTimeout(IN_TM);IN_I++;introSlide()};
  IN_TM=setTimeout(avancar,IN_V?Math.max(6000,voz.length*90+3000):Math.max(4500,voz.length*60+2500));
  if(IN_V)falar(voz,function(){setTimeout(avancar,700)});
}

function mapaLimpar(){try{if(typeof MAPA!=="undefined"&&MAPA&&MAPA.m){MAPA.m.remove();MAPA.m=null}}catch(e){}}
function mapaConfig(){
  if(MAPA.conf)return Promise.resolve(MAPA.conf);
  return api("GET","/mapa/config").then(function(c){MAPA.conf=c;return c}).catch(function(){
    MAPA.conf={tile_url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",attribution:"&copy; OpenStreetMap contributors",max_zoom:19};
    return MAPA.conf;
  });
}
function criarMapa(id,centro,zoom,conf,extra){
  if(typeof L==="undefined"||!document.getElementById(id))return null;
  var o={zoomControl:false,attributionControl:true};
  if(extra){for(var k in extra)o[k]=extra[k]}
  var m=L.map(id,o).setView(centro,zoom);
  L.tileLayer(conf.tile_url,{maxZoom:conf.max_zoom||19,attribution:conf.attribution||""}).addTo(m);
  return m;
}
function pinIcon(cor){return L.divIcon({className:"pin",html:'<span style="background:'+cor+'"></span>',iconSize:[26,26],iconAnchor:[13,13]})}
function kmEntre(a,b){
  var R=6371,r=function(x){return x*Math.PI/180},dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)*Math.sin(dg/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function meuLocal(sel){
  LOCSEL=!!sel;
  if(!(window.KambaVoz&&KambaVoz.localizar)){alert("A localização só funciona na aplicação instalada.");return}
  clearTimeout(LOCT);
  LOCT=setTimeout(function(){locResultado(null,null,"Não consegui obter a localização. Tente a céu aberto ou marque o local no mapa.")},25000);
  KambaVoz.localizar();
}
function locResultado(lat,lng,erro){
  clearTimeout(LOCT);
  if(erro||lat==null){alert(erro||"Sem localização.");return}
  MAPA.loc={lat:lat,lng:lng};
  var m=LOCSEL?MAPA.sel:MAPA.m;
  if(!m)return;
  m.setView([lat,lng],LOCSEL?17:14);
  if(!LOCSEL){L.circleMarker([lat,lng],{radius:8,color:"#fff",weight:3,fillColor:"#0753A6",fillOpacity:1}).addTo(m)}
}

function stepper(status,n){
  var i=status==="completed"?4:(status==="in_progress"?3:(n>0?2:1));

  return '<div class="step">'+nomes.map(function(x,k){var c=(k+1<i)?"ok":((k+1===i)?"on":"");return '<div class="'+c+'">'+x+'</div>'}).join("")+'</div>';

  function chart(dias) {
    var NS = 'http://www.w3.org/2000/svg', W = 320, H = 150, base = 122, top = 18;
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    s.style.cssText = 'width:100%;height:auto;display:block;';
    var mx = 1;
    dias.forEach(function (x) { mx = Math.max(mx, x.novos, x.respostas); });
    var step = W / dias.length;
    function txt(x, y, size, fill, str) {
      var t = document.createElementNS(NS, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-size', size); t.setAttribute('fill', fill); t.textContent = str;
      s.appendChild(t);
    }
    dias.forEach(function (x, i) {
      var cx = i * step + step / 2;
      [[x.novos, BLUE, -9], [x.respostas, ORG, 9]].forEach(function (b) {
        var h = Math.round((b[0] / mx) * (base - top));
        var r = document.createElementNS(NS, 'rect');
        r.setAttribute('x', cx + b[2] - 8); r.setAttribute('y', base - Math.max(h, 2));
        r.setAttribute('width', 16); r.setAttribute('height', Math.max(h, 2));
        r.setAttribute('rx', 4); r.setAttribute('fill', b[1]);
        s.appendChild(r);
        if (b[0] > 0) txt(cx + b[2], base - h - 4, 10, '#556', String(b[0]));
      });
      txt(cx, H - 8, 12, '#778', DIAS[new Date(x.d + 'T12:00:00Z').getUTCDay()]);
    });
    return s;
  }
