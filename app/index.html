<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kamba</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B8F5A">
<link rel="icon" href="icon.svg">
<style>
:root{--paper:#f3efe6;--card:#fffdf8;--ink:#1b1a17;--mut:#7a7466;--line:#d9d2c0;--g:#0B8F5A;--gd:#075c3b;--ochre:#c8841a;--red:#b3382c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);line-height:1.45;font-variant-numeric:tabular-nums}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:78px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px;background:var(--paper);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:5}
header b{font-family:Georgia,"Times New Roman",serif;font-size:30px;font-weight:700;letter-spacing:-1px;text-transform:lowercase;color:var(--g)}
header b::after{content:".";color:var(--ochre)}
header span{font-size:13px;color:var(--mut)}
header a{color:var(--ink);text-decoration:underline;cursor:pointer}
main{padding:18px}
h2{font-family:Georgia,"Times New Roman",serif;font-size:27px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.4px}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mut);margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.muted{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:3px;padding:14px 14px 12px;margin:10px 0}
.card[data-go]{cursor:pointer}
.card[data-go]:active{background:#f7f2e6}
.st-open{border-left-color:var(--g)}
.st-in_progress{border-left-color:var(--ochre)}
.st-completed{border-left-color:var(--ink)}
.st-cancelled{border-left-color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:5px 0}
.card .row b{font-family:Georgia,"Times New Roman",serif;font-size:17px;font-weight:700}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--g);border-radius:2px;color:var(--gd);white-space:nowrap}
.tag.in_progress,.tag.pending{border-color:var(--ochre);color:#8a5a0c}
.tag.completed,.tag.accepted{border-color:var(--ink);color:var(--ink)}
.tag.rejected,.tag.cancelled{border-color:var(--red);color:var(--red)}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-bottom:2px solid var(--ink);border-radius:3px 3px 0 0;margin:6px 0;background:var(--card);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-bottom-color:var(--g);background:#fff}
textarea{min-height:84px}
button.pri{display:block;width:100%;padding:13px;border:0;border-radius:3px;background:var(--g);color:#fff;font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 3px 0 var(--gd)}
button.pri:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gd)}
nav{overflow-x:auto;position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--paper);border-top:2px solid var(--ink);max-width:760px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1 0 auto;padding:15px 12px 13px;border:0;background:none;color:var(--mut);font-weight:700;font-size:11.5px;letter-spacing:0;cursor:pointer}
nav button.on{color:var(--g);box-shadow:inset 0 -3px 0 var(--g)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:3px;padding:12px}
.kpi .muted{font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.kpi b{display:block;font-family:Georgia,"Times New Roman",serif;font-size:25px;color:var(--ink);margin-top:6px;letter-spacing:-.5px}
.err{color:var(--red)}
a[data-go],a[data-act]{color:var(--g);cursor:pointer;font-weight:700}
.msgs{height:52vh;overflow-y:auto;padding:6px 2px;margin-top:8px}
.msg{max-width:82%;background:var(--card);border:1px solid var(--line);padding:8px 10px;margin:6px 0;border-radius:3px;word-wrap:break-word}
.msg.me{margin-left:auto;background:#e3efe6;border-color:#b9d6c3}
.msg small{display:block;color:var(--mut);font-size:11px;margin-top:2px;text-align:right}
.chk label{display:inline-block;margin:4px 12px 4px 0;font-size:15px}
.chk input{width:auto;margin:0 5px 0 0}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;font-size:14px}
#toast.show{opacity:1}
.auth{max-width:420px;margin:9vh auto 0;padding:0 20px}
.auth h1{font-family:Georgia,"Times New Roman",serif;font-size:58px;letter-spacing:-2px;margin:0;text-transform:lowercase;color:var(--g);line-height:1}
.auth h1::after{content:".";color:var(--ochre)}
.auth p.sub{color:var(--mut);margin:8px 0 22px;font-size:17px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>window.KAMBA_API = "https://kamba-rtm5.onrender.com";</script>
<script>
const API = (window.KAMBA_API || '').replace(/\/$/, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kz = n => new Intl.NumberFormat('pt-AO').format(n || 0) + ' Kz';
const ST = {open:'Aberto', in_progress:'Em curso', completed:'Concluído', cancelled:'Cancelado', pending:'Pendente', accepted:'Aceite', rejected:'Rejeitada'};
const CATS = ['Eletricidade', 'Canalização', 'Pintura', 'Limpeza', 'Informática', 'Mecânica', 'Construção', 'Outros', 'Carpintaria', 'Serralharia', 'Jardinagem', 'Cabeleireiro e Beleza', 'Costura e Alfaiataria', 'Ar Condicionado e Refrigeração', 'Eletrodomésticos', 'Informática e Telemóveis', 'Explicações', 'Fotografia e Vídeo', 'Eventos e Animação'];
let token = localStorage.getItem('kt'), me = null, isAdmin = false;
let view = {name:'explore'}, lastTab = 'explore';

function toast(m){ const t=$('#toast'); t.textContent=m; t.className='show'; setTimeout(()=>t.className='',2600); }

async function api(method, path, body){
  const r = await fetch(API + path, {
    method,
    headers: Object.assign({'Content-Type':'application/json'}, token ? {Authorization:'Bearer '+token} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  let d = {}; try { d = await r.json(); } catch(e) {}
  if (r.status === 401 && token) { token = null; localStorage.removeItem('kt'); }
  if (!r.ok) throw new Error(d.error || ('Erro ' + r.status));
  return d;
}

function renderAuth(mode){
  const reg = mode === 'register';
  $('#app').innerHTML = `<div class="auth"><h1>Kamba</h1><p class="sub">Tecnologia que conecta.</p>
  <div class="card"><form data-form="${reg?'register':'login'}">
  ${reg?'<input name="name" placeholder="Nome" required>':''}
  <input name="email" type="email" placeholder="Email" required>
  <input name="password" type="password" placeholder="Senha (mín. 6)" required minlength="6">
  <button class="pri">${reg?'Criar conta':'Entrar'}</button></form>
  <p class="muted" style="text-align:center">${reg?'Já tens conta?':'Ainda não tens conta?'}
  <a data-act="${reg?'toLogin':'toRegister'}">${reg?'Entrar':'Criar conta'}</a></p>
  <p class="muted" style="text-align:center"><a data-act="guest">Usar só neste aparelho, sem conta</a></p></div></div>`;
}

async function boot(){
  if (!token) { if (localStorage.getItem('kguest') === '1') return startGuest(); return renderAuth('login'); }
  try {
    guest = false;
    me = await api('GET', '/me');
    await adoptGuest();
    try { localStorage.setItem('km', JSON.stringify({id: me.id, name: me.name, email: me.email})); } catch(e) {}
    try { const vs = await api('GET', '/me/verify'); me.verified = vs.verified; me.verifyRequired = vs.required; } catch(e) {}
    try { const c = await api('POST', '/me/claim'); if (c.joined) toast('Foste adicionado a ' + c.joined + ' equipa(s)'); } catch(e) {}
    try { await api('GET', '/admin/metrics'); isAdmin = true; } catch(e) { isAdmin = false; }
    view = {name:'home'}; render();
  } catch(e) { if (token && e instanceof TypeError && localStorage.getItem('km')) { me = JSON.parse(localStorage.getItem('km')); isAdmin = false; view = {name:'space'}; render(); } else renderAuth('login'); }
}

function go(name, id){ view = {name, id}; if (name !== 'detail') lastTab = name; render(); }

function render(){
  clearInterval(window.chatTimer);
  refreshBell();
  const tabs = guest ? [['space','Espaço']] : [['home','Início']].concat(MODS.filter(m => modsActive().includes(m.k)).map(m => [m.go, m.tab]), [['me','Perfil']]);
  if (isAdmin) { tabs.push(['admin','Painel']); tabs.push(['metrics','Métricas']); }
  const active = (view.name === 'detail' || view.name === 'chat') ? lastTab : (['org','channel'].includes(view.name) ? 'team' : view.name);
  $('#app').innerHTML = `<header><b>Kamba</b><span>${guest ? '<a data-act="toRegister2">Criar conta</a>' : `<a data-go="notif" id="bell">Avisos</a> · ${esc(me.name)} · <a data-act="logout">sair</a>`}</span></header>
  ${me.verifyRequired && !me.verified ? '<div class="card st-in_progress" style="margin:10px 18px 0"><b>Confirma o teu email</b> <a data-go="verify">Confirmar agora</a></div>' : ''}<main id="main"><p class="muted">A carregar…</p></main>
  <nav>${tabs.map(t=>`<button data-go="${t[0]}" class="${(t[0]===active || (t[0]==='explore' && ['mine','props'].includes(active)))?'on':''}">${t[1]}</button>`).join('')}</nav>`;
  const views = {explore:vExplore, detail:vDetail, mine:vMine, props:vProps, home:vHome, verify:vVerify, admin:vAdmin, notif:vNotif, ai:vAi, space:vSpace, channel:vChannel, me:vMe, chat:vChat, team:vTeam, org:vOrg, metrics:vMetrics};
  views[view.name]().catch(e => { $('#main').innerHTML = `<p class="err">${esc(e.message)}</p>`; });
}

function reqCard(r){
  return `<div class="card st-${r.status}" data-go="detail" data-id="${r.id}">
  <div class="row"><b>${esc(r.title)}</b><span class="tag ${r.status}">${ST[r.status]||r.status}</span></div>
  <div class="muted">${esc(r.category)} · ${esc(r.location) || 'sem local'}</div>
  <div class="row"><span>Orçamento ${kz(r.budget_kz)}</span><span class="muted">${r.proposals_count} proposta(s)</span></div></div>`;
}

async function vExplore(){
  const list = await api('GET', '/requests');
  $('#main').innerHTML = `<h2>Trabalhos à espera de proposta</h2><p class="muted">Vê o que as pessoas precisam e envia o teu preço.</p>
  <p><a data-go="mine">Pedir um serviço e os meus pedidos</a> · <a data-go="props">As minhas propostas</a></p>`
    + (list.length ? list.map(reqCard).join('') : '<p class="muted">Neste momento não há trabalhos abertos. Volta daqui a pouco.</p>');
}

async function vMine(){
  const list = await api('GET', '/requests/mine');
  $('#main').innerHTML = `<h2>Precisas de um profissional?</h2><p class="muted">Descreve o trabalho. Os profissionais enviam propostas e tu escolhes.</p><div class="card"><form data-form="newreq">
  <input name="title" placeholder="Ex: trocar o quadro elétrico da casa" required>
  <select name="category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
  <input name="location" placeholder="Local (ex: Luanda, Talatona)">
  <input name="budget_kz" type="number" min="0" placeholder="Orçamento em Kz" required>
  <textarea name="description" placeholder="Descrição"></textarea>
  <button class="pri">Publicar o pedido</button></form></div>
  <h3>Os meus pedidos</h3>` + (list.length ? list.map(reqCard).join('') : '<p class="muted">Ainda não fizeste pedidos.</p>');
}

async function vProps(){
  const list = await api('GET', '/proposals/mine');
  $('#main').innerHTML = `<h2>As minhas propostas</h2>` + (list.length ? list.map(p => `
  <div class="card" data-go="detail" data-id="${p.request ? p.request.id : ''}">
  <div class="row"><b>${esc(p.request ? p.request.title : '?')}</b><span class="tag ${p.status}">${ST[p.status]||p.status}</span></div>
  <div class="row"><span>Propus ${kz(p.price_kz)}</span><span class="muted">${esc(p.message)}</span></div></div>`).join('')
  : '<p class="muted">Ainda não enviaste propostas.</p>');
}

async function vDetail(){
  const r = await api('GET', '/requests/' + view.id);
  const mine = r.client_id === me.id;
  let h = `<p><a data-go="${lastTab}">← Voltar</a></p>
  <div class="card"><div class="row"><b>${esc(r.title)}</b><span class="tag ${r.status}">${ST[r.status]||r.status}</span></div>
  <div class="muted">${esc(r.category)} · ${esc(r.location) || 'sem local'} · cliente ${esc(r.client_name)}</div>
  <p>${esc(r.description)}</p><b>Orçamento ${kz(r.budget_kz)}</b></div>`;
  if (mine) {
    const props = r.proposals || [];
    const profs = await Promise.all(props.map(async p => Object.assign({}, await api('GET', '/pros/' + p.pro_id), await api('GET', '/pros/' + p.pro_id + '/profile'))));
    h += `<h3>Propostas (${props.length})</h3>`;
    if (!props.length) h += '<p class="muted">Ainda sem propostas. Os profissionais verão o teu pedido.</p>';
    props.forEach((p, i) => {
      const f = profs[i];
      h += `<div class="card"><div class="row"><b>${esc(p.pro_name)}</b><span class="tag ${p.status}">${ST[p.status]||p.status}</span></div>
      <div class="muted">${f.rating_avg ? '★ ' + f.rating_avg + ' (' + f.reviews_count + ')' : 'Sem avaliações'} · ${f.jobs_completed} trabalho(s) concluído(s)</div>
      <div class="muted">${esc(f.zone || '')}${f.categories.length ? (f.zone ? ' · ' : '') + esc(f.categories.join(', ')) : ''}</div>
      ${f.bio ? '<p>' + esc(f.bio) + '</p>' : ''}
      <div class="row"><b>${kz(p.price_kz)}</b></div><div>${esc(p.message)}</div>
      <p><a data-act="openchat" data-id="${r.id}" data-pid="${p.pro_id}">Conversar com ${esc(p.pro_name)}</a></p>
      ${r.status === 'open' ? `<button class="pri" data-act="accept" data-id="${r.id}" data-pid="${p.id}">Fechar com este profissional</button>` : ''}</div>`;
    });
    if (r.status === 'in_progress') h += `<button class="pri" data-act="complete" data-id="${r.id}">O trabalho ficou feito</button>`;
    if (r.status === 'completed') h += `<div class="card"><b>Serviço concluído</b><p class="muted">Comissão Kamba: ${kz(r.commission_kz)}</p>
      <form data-form="review" data-id="${r.id}"><select name="rating"><option value="5">★★★★★ Excelente</option><option value="4">★★★★ Bom</option><option value="3">★★★ Razoável</option><option value="2">★★ Fraco</option><option value="1">★ Mau</option></select>
      <textarea name="comment" placeholder="Comentário (opcional)"></textarea><button class="pri">Avaliar profissional</button></form></div>`;
  } else if (r.my_proposal) {
    const p = r.my_proposal;
    h += `<div class="card"><div class="row"><b>A tua proposta</b><span class="tag ${p.status}">${ST[p.status]||p.status}</span></div><b>${kz(p.price_kz)}</b><p>${esc(p.message)}</p><p><a data-act="openchat" data-id="${r.id}" data-pid="${me.id}">Conversar com o cliente</a></p></div>`;
  } else if (r.status === 'open') {
    h += `<h3>Enviar proposta</h3><div class="card"><form data-form="propose" data-id="${r.id}">
    <input name="price_kz" type="number" min="1" placeholder="O teu preço em Kz" required>
    <textarea name="message" placeholder="Mensagem ao cliente (prazo, experiência…)"></textarea>
    <button class="pri">Enviar proposta</button></form></div>`;
  }
  $('#main').innerHTML = h;
}

async function vMetrics(){
  const m = await api('GET', '/admin/metrics');
  const k = (l, v) => `<div class="kpi"><span class="muted">${l}</span><b>${v}</b></div>`;
  const s = m.requests_by_status;
  $('#main').innerHTML = `<h2>Métricas do negócio</h2><div class="grid">
  ${k('Utilizadores', m.users)}${k('Pedidos', m.requests_total)}
  ${k('Propostas por pedido', m.proposals_per_request)}${k('Taxa de conclusão', Math.round(m.completion_rate*100) + '%')}
  ${k('Valor movimentado', kz(m.gmv_kz))}${k('Comissão Kamba', kz(m.commission_kz))}</div>
  <h3>Pedidos por estado</h3><div class="card">
  <div class="row"><span>Abertos</span><b>${s.open}</b></div><div class="row"><span>Em curso</span><b>${s.in_progress}</b></div>
  <div class="row"><span>Concluídos</span><b>${s.completed}</b></div><div class="row"><span>Cancelados</span><b>${s.cancelled}</b></div></div>
  <p class="muted">Dados reais da base de dados. Comissão de ${Math.round(m.commission_rate*100)}% sobre contratos concluídos.</p>`;
}

const ROLE = {owner:'Dono', admin:'Coordenador', member:'Membro'};
const TS = {todo:'Por fazer', doing:'A fazer', done:'Feito'};
const TCLS = {todo:'pending', doing:'in_progress', done:'completed'};
const TCARD = {todo:'st-open', doing:'st-in_progress', done:'st-completed'};

async function vTeam(){
  const orgs = await api('GET', '/orgs');
  $('#main').innerHTML = `<h2>A tua equipa</h2><p class="muted">Cada pessoa vê o seu trabalho. Quem coordena vê o conjunto.</p>`
    + (orgs.length ? orgs.map(o => `<div class="card st-open" data-go="org" data-id="${o.id}"><div class="row"><b>${esc(o.name)}</b><span class="tag">${ROLE[o.role] || o.role}</span></div></div>`).join('')
       : '<p class="muted">Ainda não fazes parte de nenhuma equipa.</p>')
    + `<h3>Criar equipa</h3><div class="card"><form data-form="neworg"><input name="name" placeholder="Nome da empresa ou equipa" required><button class="pri">Criar equipa</button></form></div>`;
}

async function vOrg(){
  const orgs = await api('GET', '/orgs');
  const o = orgs.find(x => x.id === view.id);
  if (!o) throw new Error('Equipa não encontrada');
  const lead = o.role !== 'member';
  const calls = [api('GET', '/orgs/' + o.id + '/tasks'), api('GET', '/orgs/' + o.id + '/members')];
  if (lead) calls.push(api('GET', '/orgs/' + o.id + '/summary'));
  const [tasks, members, sum] = await Promise.all(calls);
  let h = `<p><a data-go="team">← Equipas</a></p><h2>${esc(o.name)}</h2>
  <p class="muted">O teu papel: ${ROLE[o.role]}. ${lead ? 'Vês o trabalho de toda a equipa.' : 'Vês apenas as tuas tarefas.'}</p>
  <p><a data-act="openchannel" data-id="${o.id}">Canal da equipa →</a></p>`;
  if (lead) {
    h += `<h3>Panorama</h3><div class="card">`
      + sum.members.map(m => `<div class="row"><span>${esc(m.name)}</span><span class="muted">${m.todo} por fazer · ${m.doing} a fazer · ${m.done} feitas</span></div>`).join('')
      + (sum.unassigned ? `<div class="row"><span class="muted">Sem responsável</span><b>${sum.unassigned}</b></div>` : '') + `</div>`;
  }
  h += `<h3>Tarefas</h3>`;
  h += tasks.length ? tasks.map(t => `<div class="card ${TCARD[t.status]}">
    <div class="row"><b>${esc(t.title)}</b><span class="tag ${TCLS[t.status]}">${TS[t.status]}</span></div>
    <div class="muted">${t.assignee_name ? esc(t.assignee_name) : 'Sem responsável'}${t.due ? ' · prazo ' + esc(t.due) : ''}</div>
    ${t.description ? '<p>' + esc(t.description) + '</p>' : ''}
    <div class="muted">Mover para: ${['todo','doing','done'].filter(x => x !== t.status).map(x => `<a data-act="taskstatus" data-id="${t.id}" data-st="${x}">${TS[x]}</a>`).join(' · ')}</div></div>`).join('')
    : '<p class="muted">Sem tarefas por agora.</p>';
  if (lead) {
    h += `<h3>Nova tarefa</h3><div class="card"><form data-form="newtask" data-id="${o.id}">
    <input name="title" placeholder="O que é preciso fazer?" required>
    <select name="assignee_email"><option value="">Sem responsável</option>${members.map(m => `<option value="${esc(m.email)}">${esc(m.name)}</option>`).join('')}</select>
    <input name="due" type="date">
    <textarea name="description" placeholder="Detalhes (opcional)"></textarea>
    <button class="pri">Criar tarefa</button></form></div>
    <h3>Membros</h3><div class="card">${members.map(m => `<div class="row"><span>${esc(m.name)}</span><span class="tag">${ROLE[m.role] || m.role}</span></div>`).join('')}</div>
    <div class="card"><form data-form="addmember" data-id="${o.id}">
    <input name="email" type="email" placeholder="Email da pessoa (com ou sem conta Kamba)" required>
    <select name="role"><option value="member">Membro</option><option value="admin">Coordenador</option></select>
    <button class="pri">Adicionar à equipa</button></form></div>`;
  }
  $('#main').innerHTML = h;
}

function drawMsgs(d){
  const box = $('#msgs'); if (!box) return;
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = d.messages.length
    ? d.messages.map(m => `<div class="msg ${m.mine ? 'me' : ''}"><div>${esc(m.body)}</div><small>${new Date(m.created_at + 'Z').toLocaleTimeString('pt-AO', {hour:'2-digit', minute:'2-digit'})}</small></div>`).join('')
    : '<p class="muted">Ainda sem mensagens. Combinem aqui o prazo e os detalhes do trabalho.</p>';

let spaceDb = null, spaceDbUser = null, syncing = false, spaceState = 'local';
const newCid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID().replace(/-/g, '') : (Date.now().toString(36) + Math.random().toString(36).slice(2, 12));

function spaceOpen(){
  if (spaceDb && spaceDbUser === me.id) return Promise.resolve(spaceDb);
  if (spaceDb) { spaceDb.close(); spaceDb = null; }
  return new Promise((ok, fail) => {
    const rq = indexedDB.open('kamba-space-' + me.id, 1);
    rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('items', {keyPath: 'cid'}); d.createObjectStore('deleted', {keyPath: 'cid'}); };
    rq.onsuccess = () => { spaceDb = rq.result; spaceDbUser = me.id; ok(spaceDb); };
    rq.onerror = () => fail(rq.error);
  });
}

function idb(store, mode, fn){
  return spaceOpen().then(d => new Promise((ok, fail) => {
    const tx = d.transaction(store, mode);
    const req = fn(tx.objectStore(store));
    tx.oncomplete = () => ok(req ? req.result : undefined);
    tx.onerror = () => fail(tx.error);
    tx.onabort = () => fail(tx.error);
  }));
}
const spaceAll = () => idb('items', 'readonly', st => st.getAll());
const spaceDeleted = () => idb('deleted', 'readonly', st => st.getAll());

async function spaceAdd(kind, title, body){
  await idb('items', 'readwrite', st => st.put({cid: newCid(), kind, title: title.trim().slice(0, 160), body: (body || '').trim().slice(0, 4000), done: false, updated_at: Date.now(), dirty: true}));
  syncSpace();
}

async function spaceToggle(cid){
  await idb('items', 'readwrite', st => {
    const g = st.get(cid);
    g.onsuccess = () => { const it = g.result; if (it && it.kind === 'todo') { it.done = !it.done; it.updated_at = Date.now(); it.dirty = true; st.put(it); } };
    return g;
  });
  await drawSpaceLists();
  syncSpace();
}

async function spaceDelete(cid){
  await idb('items', 'readwrite', st => st.delete(cid));
  await idb('deleted', 'readwrite', st => st.put({cid}));
  await drawSpaceLists();
  syncSpace();
}

async function paintSpaceState(){
  const el = $('#syncst'); if (!el) return;
  const pending = (await spaceAll()).filter(i => i.dirty).length + (await spaceDeleted()).length;
  const txt = {
    offline: 'Sem ligação. Tudo fica guardado neste aparelho e sincroniza quando voltares a ter rede.',
    error: 'Não consegui sincronizar agora. Os dados estão seguros neste aparelho.',
    synced: 'Guardado neste aparelho e sincronizado.',
    local: 'Guardado neste aparelho.'
  }[spaceState];
  el.textContent = txt + (pending ? ' Por sincronizar: ' + pending + '.' : '');
}

async function syncSpace(){
  if (syncing || !token || !me) return;
  if (!navigator.onLine) { spaceState = 'offline'; paintSpaceState(); return; }
  syncing = true;
  try {
    const dirty = (await spaceAll()).filter(i => i.dirty);
    const gone = (await spaceDeleted()).map(x => x.cid);
    const d = await api('POST', '/me/sync', {
      items: dirty.map(i => ({cid: i.cid, kind: i.kind, title: i.title, body: i.body, done: i.done, updated_at: i.updated_at})),
      deleted: gone
    });
    const serverCids = new Set(d.items.map(i => i.cid));
    const tomb = new Set(d.tombstones || []);
    const now = await spaceAll();
    const loc = Object.fromEntries(now.map(i => [i.cid, i]));
    await idb('items', 'readwrite', st => {
      d.items.forEach(si => {
        const l = loc[si.cid];
        if (l && l.updated_at > si.updated_at) return;
        st.put({cid: si.cid, kind: si.kind, title: si.title, body: si.body, done: si.done, updated_at: si.updated_at, dirty: false});
      });
      now.forEach(l => { if (tomb.has(l.cid) || (!serverCids.has(l.cid) && !l.dirty)) st.delete(l.cid); });
    });
    await idb('deleted', 'readwrite', st => { gone.forEach(c => st.delete(c)); });
    spaceState = 'synced';
  } catch(e) { spaceState = navigator.onLine ? 'error' : 'offline'; }
  syncing = false;
  if (view.name === 'space') await drawSpaceLists(); else paintSpaceState();
}

async function spaceLogout(){
  if (!me) return;
  try {
    await syncSpace();
    const pending = (await spaceAll()).filter(i => i.dirty).length + (await spaceDeleted()).length;
    if (pending) { toast('Há itens por sincronizar; ficam neste aparelho'); return; }
    if (spaceDb) { spaceDb.close(); spaceDb = null; }
    indexedDB.deleteDatabase('kamba-space-' + me.id);
  } catch(e) {}
}

function adoptGuest(){
  return new Promise(done => {
    if (localStorage.getItem('kguest') !== '1') return done();
    const rq = indexedDB.open('kamba-space-0', 1);
    rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('items', {keyPath: 'cid'}); d.createObjectStore('deleted', {keyPath: 'cid'}); };
    rq.onerror = () => done();
    rq.onsuccess = async () => {
      try {
        const gd = rq.result;
        const items = await new Promise((ok, fail) => {
          const tx = gd.transaction('items', 'readonly');
          const r = tx.objectStore('items').getAll();
          tx.oncomplete = () => ok(r.result);
          tx.onerror = () => fail();
        });
        gd.close();
        for (const it of items) await idb('items', 'readwrite', st => st.put(Object.assign({}, it, {dirty: true})));
        indexedDB.deleteDatabase('kamba-space-0');
        localStorage.removeItem('kguest');
        if (items.length) toast(items.length + ' item(s) do modo local passaram para a tua conta');
      } catch(e) {}
      done();
    };
  });
}

    await api('POST', '/me/profile', {bio: f.get('bio'), zone: f.get('zone'), categories: f.getAll('cat')});
    toast('Perfil guardado');
  },
  async send(f, id){
    const q = view.pid ? '?pro_id=' + view.pid : '';
    const d = await api('POST', '/requests/' + id + '/chat', {body: f.get('body'), pro_id: view.pid});
    $('#chatbox').value = '';
    drawMsgs(d);
    const box = $('#msgs'); box.scrollTop = box.scrollHeight;
  },
  async neworg(f){ const d = await api('POST','/orgs',{name:f.get('name')}); toast('Equipa criada'); go('org', d.id); },
  async newtask(f, id){ await api('POST','/orgs/'+id+'/tasks',{title:f.get('title'),description:f.get('description'),assignee_email:f.get('assignee_email'),due:f.get('due')}); toast('Tarefa criada'); render(); },
  async addmember(f, id){ const d = await api('POST','/orgs/'+id+'/invites',{email:f.get('email'),role:f.get('role')}); toast(d.status === 'added' ? d.name + ' entrou na equipa' : 'Convite guardado. Entra na equipa quando criar conta com este email'); render(); },
  async login(f){ const d = await api('POST','/auth/login',{email:f.get('email'),password:f.get('password')}); token = d.token; localStorage.setItem('kt', token); await boot(); },
  async register(f){ const d = await api('POST','/auth/register',{name:f.get('name'),email:f.get('email'),password:f.get('password')}); token = d.token; localStorage.setItem('kt', token); await boot(); },
  async newreq(f){ const d = await api('POST','/requests',{title:f.get('title'),category:f.get('category'),location:f.get('location'),budget_kz:f.get('budget_kz'),description:f.get('description')}); toast('Pedido publicado'); go('detail', d.id); },
  async propose(f, id){ await api('POST',`/requests/${id}/proposals`,{price_kz:f.get('price_kz'),message:f.get('message')}); toast('Proposta enviada'); render(); },
  async review(f, id){ await api('POST',`/requests/${id}/review`,{rating:f.get('rating'),comment:f.get('comment')}); toast('Obrigado pela avaliação'); render(); }
};

document.addEventListener('submit', async e => {
  const el = e.target.closest('form[data-form]'); if (!el) return;
  e.preventDefault();
  try { await forms[el.dataset.form](new FormData(el), el.dataset.id); } catch(err) { toast(err.message); }
});

document.addEventListener('click', async e => {
  const g = e.target.closest('[data-go]');
  if (g) { go(g.dataset.go, g.dataset.id ? +g.dataset.id : undefined); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  try {
    if (act === 'logout') { await spaceLogout(); aiLog = []; token = null; localStorage.removeItem('kt'); renderAuth('login'); }
    else if (act === 'toRegister') renderAuth('register');
    else if (act === 'toLogin') renderAuth('login');
    else if (act === 'guest') { startGuest(); }
    else if (act === 'toRegister2') { guest = false; me = null; renderAuth('register'); }
    else if (act === 'opennotif') {
      const v = a.dataset.view;
      if (v === 'chat') { view = {name:'chat', id:+a.dataset.id, pid:+a.dataset.pid}; render(); }
      else go(v, +a.dataset.id);
    }
    else if (act === 'askq') { await askAi(a.dataset.q); }
    else if (act === 'toggleitem') { await spaceToggle(a.dataset.id); }
    else if (act === 'delitem') { if (confirm('Apagar este item?')) { await spaceDelete(a.dataset.id); } }
    else if (act === 'openchannel') { view = {name:'channel', id:+a.dataset.id}; render(); }
    else if (act === 'openchat') { view = {name:'chat', id:+a.dataset.id, pid:+a.dataset.pid}; render(); }
    else if (act === 'taskstatus') { await api('POST', '/tasks/' + a.dataset.id + '/status', {status: a.dataset.st}); render(); }
    else if (act === 'accept') { await api('POST', `/requests/${a.dataset.id}/accept`, {proposal_id: +a.dataset.pid}); toast('Proposta aceite'); render(); }
    else if (act === 'complete') { await api('POST', `/requests/${a.dataset.id}/complete`); toast('Serviço concluído'); render(); }
  } catch(err) { toast(err.message); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
boot();
/* === APOIO AO CLIENTE === */
(function () {
  var KS = { uid: null, staff: false };
  function el(tag, css, txt) {
    var e = document.createElement(tag);
    if (css) e.style.cssText = css;
    if (txt != null) e.textContent = txt;
    return e;
  }
  var CARD = 'background:#1a1d24;color:#e8eaf0;border-radius:12px;padding:12px;margin-bottom:8px;';
  var INP = 'width:100%;box-sizing:border-box;background:#0f1115;color:#e8eaf0;border:1px solid #2a2f3a;border-radius:10px;padding:12px;font-size:16px;margin-bottom:8px;font-family:inherit;';
  var BTN = 'background:#2f6df6;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;';
  var BTN2 = 'background:#232834;color:#e8eaf0;border:0;border-radius:10px;padding:12px 16px;font-size:15px;';
  function fmt(iso) { try { return new Date(iso).toLocaleString('pt-PT'); } catch (e) { return iso; } }
  var STATUS = { open: 'Aberto', answered: 'Respondido', closed: 'Fechado' };

  function closeModal() { var o = document.getElementById('kapoio-modal'); if (o) o.remove(); }
  function openModal() {
    closeModal();
    var o = el('div', 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.6);overflow:auto;');
    o.id = 'kapoio-modal';
    var box = el('div', 'max-width:560px;margin:0 auto;min-height:100%;background:#0f1115;color:#e8eaf0;padding:16px;');
    o.appendChild(box);
    document.body.appendChild(o);
    showList(box);
  }
  function header(box, title, backFn) {
    box.textContent = '';
    var row = el('div', 'display:flex;gap:8px;align-items:center;margin-bottom:14px;');
    var b = el('button', BTN2, backFn ? '←' : '✕');
    b.onclick = backFn || closeModal;
    row.appendChild(b);
    row.appendChild(el('div', 'font-size:18px;font-weight:700;', title));
    box.appendChild(row);
  }

  function showList(box) {
    header(box, 'Apoio ao cliente');
    if (KS.staff) {
      var sb = el('button', BTN + 'width:100%;margin-bottom:12px;', 'Painel da equipa de apoio');
      sb.onclick = function () {
        window.open(API + '/apoio#t=' + encodeURIComponent(token), '_blank');
      };
      box.appendChild(sb);
    }
    var f = el('div', CARD);
    f.appendChild(el('div', 'font-weight:600;margin-bottom:8px;', 'Novo pedido'));
    var s = el('input', INP); s.placeholder = 'Assunto'; s.maxLength = 200;
    var t = el('textarea', INP + 'min-height:100px;'); t.placeholder = 'Conta-nos o que se passa...';
    var err = el('div', 'color:#ff7b7b;font-size:14px;min-height:18px;');
    var send = el('button', BTN + 'width:100%;', 'Enviar pedido');
    send.onclick = function () {
      err.textContent = '';
      api('POST', '/support/tickets', { subject: s.value, body: t.value })
        .then(function (d) { openTicket(box, d.id); })
        .catch(function (e) { err.textContent = e.message || 'Erro'; });
    };
    f.appendChild(s); f.appendChild(t); f.appendChild(err); f.appendChild(send);
    box.appendChild(f);

    box.appendChild(el('div', 'font-weight:600;margin:14px 0 8px;', 'Os meus pedidos'));
    var list = el('div');
    box.appendChild(list);
    api('GET', '/support/tickets/mine').then(function (d) {
      if (!d.tickets.length) { list.appendChild(el('div', 'color:#8b92a5;', 'Ainda não abriste nenhum pedido.')); return; }
      d.tickets.forEach(function (tk) {
        var c = el('div', CARD + 'cursor:pointer;');
        c.appendChild(el('div', 'font-weight:600;', tk.subject));
        c.appendChild(el('div', 'color:#8b92a5;font-size:13px;', (STATUS[tk.status] || tk.status) + ' · ' + fmt(tk.updated_at)));
        c.onclick = function () { openTicket(box, tk.id); };
        list.appendChild(c);
      });
    }).catch(function (e) { list.appendChild(el('div', 'color:#ff7b7b;', e.message || 'Erro')); });
  }

  function openTicket(box, id) {
    api('GET', '/support/tickets/' + id).then(function (d) {
      renderTicket(box, d);
    }).catch(function (e) { alert(e.message || 'Erro'); });
  }

  function renderTicket(box, d) {
    header(box, d.ticket.subject, function () { showList(box); });
    d.messages.forEach(function (m) {
      var mine = !m.from_staff;
      var e = el('div', 'padding:10px 12px;border-radius:12px;margin-bottom:8px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;' +
        (mine ? 'background:#2f6df6;margin-left:auto;' : 'background:#232834;'), m.body);
      e.appendChild(el('div', 'opacity:.7;font-size:11px;margin-top:4px;', (mine ? 'Tu' : 'Equipa Kamba') + ' · ' + fmt(m.created_at)));
      box.appendChild(e);
    });
    if (d.ticket.status === 'closed') {
      box.appendChild(el('div', 'color:#8b92a5;margin-top:10px;', 'Este pedido está fechado. Abre um novo se precisares.'));
      return;
    }
    var t = el('textarea', INP + 'min-height:90px;margin-top:10px;'); t.placeholder = 'Escreve a tua mensagem...';
    var err = el('div', 'color:#ff7b7b;font-size:14px;min-height:18px;');
    var send = el('button', BTN + 'width:100%;', 'Enviar');
    send.onclick = function () {
      err.textContent = '';
      api('POST', '/support/tickets/' + d.ticket.id + '/messages', { body: t.value })
        .then(function (r) { renderTicket(box, r); })
        .catch(function (e) { err.textContent = e.message || 'Erro'; });
    };
    box.appendChild(t); box.appendChild(err); box.appendChild(send);
  }

  function tick() {
    var btn = document.getElementById('kapoio-btn');
    var ok = false;
    try { ok = !!(token && me && me.id); } catch (e) { ok = false; }
    if (!ok) { if (btn) btn.remove(); closeModal(); KS.uid = null; KS.staff = false; return; }
    if (KS.uid !== me.id) {
      KS.uid = me.id; KS.staff = false;
      api('GET', '/support/me').then(function (d) { KS.staff = !!d.staff; }).catch(function () {});
    }
    if (!btn) {
      btn = el('button', 'position:fixed;right:12px;bottom:78px;z-index:9000;background:#2f6df6;color:#fff;border:0;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.4);', 'Apoio');
      btn.id = 'kapoio-btn';
      btn.onclick = openModal;
      document.body.appendChild(btn);
    }
  }
  setInterval(tick, 1500);
})();
/* === FIM APOIO === */

</script>
